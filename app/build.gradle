plugins {
    id 'com.android.application'
}

// URL publique HTTPS du verificateur CHK Paiements ; aucun secret dans l'APK.
def chkPaymentsUrl = (providers.gradleProperty('chkPaymentsVerifyEndpoint').orNull ?: '').trim()
if (chkPaymentsUrl && !(chkPaymentsUrl.startsWith('https://') && chkPaymentsUrl.endsWith('/api/v1/play/verify'))) {
    throw new GradleException('CHK Paiements doit utiliser HTTPS et /api/v1/play/verify')
}

android {
    namespace 'com.chk.blocnote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sync30.mesnotesdossiers'
        manifestPlaceholders = [appLabel: 'Mes Notes & Dossiers']
        minSdk 24
        targetSdk 36
        versionCode = (providers.gradleProperty('versionCode').orNull ?: '2').toInteger()
        versionName = providers.gradleProperty('versionName').orNull ?: '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'CHK_PAYMENTS_VERIFY_ENDPOINT', '\"' + chkPaymentsUrl + '\"'
    }

    // Signature de debug stable utilisee par les builds GitHub Actions V2 et suivants.
    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        playUpload {
            def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystore != null && !keystore.isEmpty()) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.trialtest'
            versionNameSuffix '-test'
            manifestPlaceholders = [appLabel: 'Mes Notes & Dossiers TEST']
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.playUpload
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}


// Aligner les artefacts Kotlin provenant des dependances AndroidX/Billing.
configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
