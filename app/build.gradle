plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chk.blocnote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chk.blocnote'
        manifestPlaceholders = [appLabel: 'Sync 30 Bloc-note']
        minSdk 23
        targetSdk 36
        versionCode = (providers.gradleProperty('versionCode').orNull ?: '2').toInteger()
        versionName = providers.gradleProperty('versionName').orNull ?: '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Signature de debug stable utilisee par les builds GitHub Actions V2 et suivants.
    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.trialtest'
            versionNameSuffix '-test'
            manifestPlaceholders = [appLabel: 'Sync 30 Bloc-note TEST']
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

