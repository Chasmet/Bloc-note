plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chk.blocnote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chk.blocnote'
        minSdk 21
        targetSdk 34
        versionCode = (providers.gradleProperty('versionCode').orNull ?: '2').toInteger()
        versionName = providers.gradleProperty('versionName').orNull ?: '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Signature de debug stable utilisee par les builds GitHub Actions V2 et suivants.
    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
