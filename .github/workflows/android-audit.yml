name: AUDIT - tests instrumentes Bloc-note
on:
  push:
    branches:
      - "audit/**"
    paths:
      - "app/**"
      - "gradle.properties"
      - ".github/workflows/android-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-emulator: 
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Setup Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create disposable emulator-only debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Audit Emulator,O=CI,C=FR" -keyalg RSA -keysize 2048 -validity 3650
      - name: Android emulator UI and SQLite tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          script: bash .github/scripts/run-android-audit.sh
      - name: Afficher les resultats JUnit
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          total=failed=skipped=0
          for f in Path("app/build/outputs/androidTest-results/connected").rglob("*.xml"):
              try:
                  root=E.parse(f).getroot()
                  for suite in ([root] if root.tag=="testsuite" else root.findall(".//testsuite")):
                      cases=suite.findall("testcase")
                      total+=len(cases)
                      for c in cases:
                          if c.find("failure") is not None or c.find("error") is not None:
                              failed+=1
                              print("ECHEC",c.get("classname"),c.get("name"))
                          elif c.find("skipped") is not None:
                              skipped+=1
              except Exception as e:
                  print("Rapport non lu:",f,str(e))
          print("RESULTATS: tests=",total,"echecs=",failed,"ignores=",skipped)
          PY
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocnote-audit-api${{ matrix.api-level }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/reports/androidTests/emulator-screen.png
            app/build/reports/androidTests/window-focus.txt
          if-no-files-found: warn
