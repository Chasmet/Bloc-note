name: Bloc Note Ultra - APK de test et mises a jour

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bloc-note-ultra-test-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Reutiliser la signature des anciens APK V2 : ne jamais la remplacer par
      # une autre cle si elle est indisponible, pour eviter de casser les mises a jour.
      - name: Restaurer la signature de test V2
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bloc-note-ultra-stable-signing-v2

      - name: Verifier ou initialiser la signature de test
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::warning::Cache signature V2 absent : la compatibilite avec les anciens APK doit etre verifiee."
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA256:" | head -1 >> "$GITHUB_STEP_SUMMARY"

      - name: SDK Android 34
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Preparer Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Calculer version test
        id: version
        shell: bash
        run: |
          echo "name=2.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((22000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Verifier logo JPEG
        run: |
          file app/src/main/res/drawable-nodpi/ic_note_brand.jpg
          python3 - <<'PY'
          from pathlib import Path
          b=Path("app/src/main/res/drawable-nodpi/ic_note_brand.jpg").read_bytes()
          assert len(b)>1000 and b.startswith(bytes.fromhex("ffd8ff")) and b.endswith(bytes.fromhex("ffd9")), "JPEG invalide"
          PY
          cat >/tmp/VerifyImage.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          class VerifyImage {
              public static void main(String[] args) throws Exception {
                  BufferedImage image = ImageIO.read(new File(args[0]));
                  if (image == null || image.getWidth()<100 || image.getHeight()<100) throw new IllegalStateException("JPEG illisible");
                  image.getRGB(0, 0, image.getWidth(), image.getHeight(), null, 0, image.getWidth());
                  System.out.println("Logo valide "+image.getWidth()+"x"+image.getHeight());
              }
          }
          JAVA
          java /tmp/VerifyImage.java app/src/main/res/drawable-nodpi/ic_note_brand.jpg
      - name: Compiler APK de test avec signature stable V2
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Verifier APK compile
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "Bloc-Note-Ultra-test-${{ steps.version.outputs.name }}.apk"

      - name: Artefact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Bloc-Note-Ultra-test-${{ steps.version.outputs.name }}
          path: Bloc-Note-Ultra-test-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier la version de test telechargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Bloc Note Ultra - test v${{ steps.version.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: Bloc-Note-Ultra-test-${{ steps.version.outputs.name }}.apk
