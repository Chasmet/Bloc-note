name: Play candidate — essai 24h et achat unique
on:
  push:
    branches:
      - feature/play-24h-lifetime-119-20261111
      - feature/play-sync30-mesnotesdossiers-20261112
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blocnote-play-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Restaurer cle de TEST stable
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: bloc-note-ultra-stable-signing-v2
      - name: Cle debug isolee pour application de test (ID .trialtest)
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "L'APK debug a un identifiant different (.trialtest) et ne remplace pas l'application existante." >> "$GITHUB_STEP_SUMMARY"
      - name: Configurer Gradle wrapper
        run: gradle wrapper --gradle-version 8.13
      - name: Construire APK de test et bundle NON SIGNE (non publiable)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug :app:bundleRelease --stacktrace \
            -PversionCode=$((23000 + GITHUB_RUN_NUMBER)) \
            -PversionName="2.3.${GITHUB_RUN_NUMBER}"
      - name: Verifier signature APK et paquet
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s app/build/outputs/bundle/release/app-release.aab
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          echo "APK test et bundle AAB non signe generes. N'envoyez pas l'AAB dans Play Console." >> "$GITHUB_STEP_SUMMARY"
      - name: Artefacts internes seulement — aucune Release publique
        uses: actions/upload-artifact@v4
        with:
          name: blocnote-play-candidate-24h-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
