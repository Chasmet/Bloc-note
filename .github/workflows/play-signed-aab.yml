name: Play — AAB signe pour test interne (jamais publication automatique)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/play-sync30-mesnotesdossiers-20261112
    paths:
      - '.github/workflows/play-signed-aab.yml'
      - 'app/**'
permissions:
  contents: read
jobs:
  release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Installer Android 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Restaurer cle d'upload uniquement depuis GitHub Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCNOTE_UPLOAD_JKS_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Cle d'upload Bloc-note absente des Secrets GitHub. Aucun bundle public ne peut etre cree."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blocnote-upload.jks"
          chmod 600 "$RUNNER_TEMP/blocnote-upload.jks"
          test -s "$RUNNER_TEMP/blocnote-upload.jks"
      - name: Compiler bundle release signe
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/blocnote-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_KEY_PASSWORD }}
          CHK_PAYMENTS_VERIFY_ENDPOINT: ${{ secrets.BLOCNOTE_CHK_PAYMENTS_VERIFY_URL }}
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          if [ -z "$CHK_PAYMENTS_VERIFY_ENDPOINT" ]; then
            echo "::error::BLOCNOTE_CHK_PAYMENTS_VERIFY_URL manquant, paiement inaccessible. Publication bloquee."
            exit 1
          fi
          case "$CHK_PAYMENTS_VERIFY_ENDPOINT" in
            https://*/api/v1/play/verify) ;;
            *) echo "::error::URL CHK Paiements HTTPS invalide"; exit 1;;
          esac
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint=os.environ["CHK_PAYMENTS_VERIFY_ENDPOINT"]
          health=endpoint[:-len("verify")]+"health"
          try:
              req=urllib.request.Request(health, headers={"Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=10) as response:
                  data=json.load(response)
              if data.get("ok") is not True or data.get("billingReady") is not True:
                  raise RuntimeError("verificateur non opérationnel")
          except Exception as error:
              raise SystemExit("Publication bloquée : CHK Paiements inaccessible ou désactivé")
          print("CHK Paiements vérifié, préparation du bundle autorisée.")
          PY
          ./gradlew :app:bundleRelease --stacktrace -PversionCode=$((24000 + GITHUB_RUN_NUMBER)) -PversionName=2.4.$GITHUB_RUN_NUMBER \
            -PchkPaymentsVerifyEndpoint="$CHK_PAYMENTS_VERIFY_ENDPOINT"
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -certs "$AAB"
          echo "AAB signe produit pour TEST INTERNE. Ne pas distribuer avant validation du Billing et serveur de verification." >> "$GITHUB_STEP_SUMMARY"
      - name: AAB signe — artefact reserve au depot
        uses: actions/upload-artifact@v4
        with:
          name: blocnote-signed-aab-INTERNAL
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
