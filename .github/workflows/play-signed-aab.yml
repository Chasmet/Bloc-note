name: Play — AAB commercial signé
on:
  workflow_dispatch:
    inputs:
      play_version_floor:
        description: Plus grand versionCode déjà importé dans Play Console (0 si aucun)
        required: true
        type: number
        default: 0
  push:
    branches:
      - feature/play-sync30-mesnotesdossiers-20261112
    paths:
      - '.github/workflows/play-signed-aab.yml'
      - 'app/**'
permissions:
  contents: read
jobs:
  release-bundle:
    if: github.ref == 'refs/heads/feature/play-sync30-mesnotesdossiers-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Installer Android 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Restaurer cle d'upload uniquement depuis GitHub Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCNOTE_UPLOAD_JKS_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Cle d'upload Bloc-note absente des Secrets GitHub. Aucun bundle public ne peut etre cree."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blocnote-upload.jks"
          chmod 600 "$RUNNER_TEMP/blocnote-upload.jks"
          test -s "$RUNNER_TEMP/blocnote-upload.jks"
      - name: Verifier certificat upload (SHA-256 attendu)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
        run: |
          CERT_FP="$(keytool -exportcert -keystore "$RUNNER_TEMP/blocnote-upload.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | \
            openssl x509 -inform DER -fingerprint -sha256 -noout | cut -d= -f2)"
          EXPECTED='95:4C:04:AC:6F:3A:66:66:E0:69:1B:17:95:CB:15:6C:D9:7C:9D:F9:2F:B0:0A:AD:29:AC:0B:AE:1F:02:2C:EB'
          if [ "$CERT_FP" != "$EXPECTED" ]; then
            echo "::error::Empreinte du certificat d'upload non conforme. AAB bloque."
            exit 1
          fi
          echo "Certificat d'upload conforme a la fiche Sync 30." >> "$GITHUB_STEP_SUMMARY"
      - name: Configurer l’URL HTTPS de vérification des achats
        shell: bash
        env:
          CHK_PAYMENTS_VERIFY_ENDPOINT: ${{ secrets.BLOCNOTE_CHK_PAYMENTS_VERIFY_URL || 'https://chk-universal-1.taild9e4de.ts.net:10000/api/v1/play/verify' }}
        run: |
          case "$CHK_PAYMENTS_VERIFY_ENDPOINT" in
            https://*/api/v1/play/verify) ;;
            *) echo "::error::URL CHK Paiements invalide"; exit 1 ;;
          esac
          echo "Vérifier que /api/v1/play/health répond avec billingReady=true avant soumission à Google Play." >> "$GITHUB_STEP_SUMMARY"
      - name: Calculer la version de production
        id: version
        shell: bash
        env:
          PLAY_VERSION_FLOOR: ${{ inputs.play_version_floor || 0 }}
        run: |
          VERSION_CODE=$((50000 + GITHUB_RUN_NUMBER))
          if [[ ! "$PLAY_VERSION_FLOOR" =~ ^[0-9]+$ ]] || (( VERSION_CODE <= 10#$PLAY_VERSION_FLOOR || VERSION_CODE > 2100000000 )); then
            echo "::error::versionCode commercial invalide ou déjà dépassé dans Play Console."
            exit 1
          fi
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=2.6.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Compiler le bundle commercial signé
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/blocnote-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_KEY_PASSWORD }}
          CHK_PAYMENTS_VERIFY_ENDPOINT: ${{ secrets.BLOCNOTE_CHK_PAYMENTS_VERIFY_URL || 'https://chk-universal-1.taild9e4de.ts.net:10000/api/v1/play/verify' }}
          PLAY_VERSION_CODE: ${{ steps.version.outputs.code }}
          PLAY_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace \
            -PversionCode="$PLAY_VERSION_CODE" \
            -PversionName="$PLAY_VERSION_NAME" \
            -PchkPaymentsVerifyEndpoint="$CHK_PAYMENTS_VERIFY_ENDPOINT"
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" | grep -q "jar verified"
          CERT_FP="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          EXPECTED='95:4C:04:AC:6F:3A:66:66:E0:69:1B:17:95:CB:15:6C:D9:7C:9D:F9:2F:B0:0A:AD:29:AC:0B:AE:1F:02:2C:EB'
          if [ "$CERT_FP" != "$EXPECTED" ]; then
            echo "::error::Certificat du bundle different de celui de la cle d'upload."
            exit 1
          fi
      - name: Inspecter le manifeste et l’intégrité du bundle
        shell: bash
        env:
          PLAY_VERSION_CODE: ${{ steps.version.outputs.code }}
          PLAY_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/play-release-manifest.xml"
          python3 - "$RUNNER_TEMP/play-release-manifest.xml" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          manifest = ET.parse(sys.argv[1]).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          assert manifest.attrib['package'] == 'com.sync30.mesnotesdossiers'
          assert manifest.attrib[android + 'versionCode'] == os.environ['PLAY_VERSION_CODE']
          assert manifest.attrib[android + 'versionName'] == os.environ['PLAY_VERSION_NAME']
          assert manifest.find('uses-sdk').attrib[android + 'targetSdkVersion'] == '36'
          permissions = {item.attrib[android + 'name'] for item in manifest.findall('uses-permission')}
          allowed = {'android.permission.INTERNET', 'com.android.vending.BILLING',
                     'android.permission.ACCESS_NETWORK_STATE'}
          assert {'android.permission.INTERNET', 'com.android.vending.BILLING'} <= permissions <= allowed, permissions
          billing = manifest.find("application/meta-data[@" + android + "name='com.google.android.play.billingclient.version']")
          assert billing is not None and billing.attrib[android + 'value'].startswith('9.'), 'Version Play Billing absente ou inattendue'
          print('Package, SDK, versions, permissions et bibliothèque Play Billing vérifiés.')
          PY
          sha256sum "$AAB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: AAB commercial signé — artefact réservé au dépôt
        uses: actions/upload-artifact@v4
        with:
          name: mesnotesdossiers-production-v${{ steps.version.outputs.code }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
