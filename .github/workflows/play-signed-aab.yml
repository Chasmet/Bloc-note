name: Play — AAB release signe (artefact de test interne uniquement)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/play-sync30-mesnotesdossiers-20261112
    paths:
      - '.github/workflows/play-signed-aab.yml'
      - 'app/**'
permissions:
  contents: read
jobs:
  release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Installer Android 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Restaurer cle d'upload uniquement depuis GitHub Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCNOTE_UPLOAD_JKS_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Cle d'upload Bloc-note absente des Secrets GitHub. Aucun bundle public ne peut etre cree."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blocnote-upload.jks"
          chmod 600 "$RUNNER_TEMP/blocnote-upload.jks"
          test -s "$RUNNER_TEMP/blocnote-upload.jks"
      - name: Verifier certificat upload (SHA-256 attendu)
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
        run: |
          CERT_FP="$(keytool -exportcert -keystore "$RUNNER_TEMP/blocnote-upload.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | \
            openssl x509 -inform DER -fingerprint -sha256 -noout | cut -d= -f2)"
          EXPECTED='95:4C:04:AC:6F:3A:66:66:E0:69:1B:17:95:CB:15:6C:D9:7C:9D:F9:2F:B0:0A:AD:29:AC:0B:AE:1F:02:2C:EB'
          if [ "$CERT_FP" != "$EXPECTED" ]; then
            echo "::error::Empreinte du certificat d'upload non conforme. AAB bloque."
            exit 1
          fi
          echo "Certificat d'upload conforme a la fiche Sync 30." >> "$GITHUB_STEP_SUMMARY"
      - name: Verifier la preparation du serveur CHK Paiements (information uniquement)
        shell: bash
        env:
          CHK_PAYMENTS_VERIFY_ENDPOINT: ${{ secrets.BLOCNOTE_CHK_PAYMENTS_VERIFY_URL }}
        run: |
          if [ -z "$CHK_PAYMENTS_VERIFY_ENDPOINT" ]; then
            echo "AVERTISSEMENT : URL CHK Paiements absente. AAB SIGNE pour tests techniques SEULEMENT ; Billing non utilisable. Aucune soumission production." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$CHK_PAYMENTS_VERIFY_ENDPOINT" in
            https://*/api/v1/play/verify) ;;
            *) echo "::error::URL CHK Paiements invalide"; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint = os.environ["CHK_PAYMENTS_VERIFY_ENDPOINT"]
          health = endpoint[:-len("verify")] + "health"
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(health, headers={"Accept":"application/json"}),
                  timeout=10
              ) as response:
                  data = json.load(response)
              if data.get("ok") is not True or data.get("billingReady") is not True:
                  raise RuntimeError("verificateur indisponible ou API Google non prete")
          except Exception:
              raise SystemExit("CHK Paiements non pret. Aucun AAB signe avec endpoint invalide.")
          print("CHK Paiements endpoint verifie au moment de la compilation.")
          PY
      - name: Compiler bundle release signe pour controle interne
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/blocnote-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.BLOCNOTE_UPLOAD_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.BLOCNOTE_UPLOAD_KEY_PASSWORD }}
          CHK_PAYMENTS_VERIFY_ENDPOINT: ${{ secrets.BLOCNOTE_CHK_PAYMENTS_VERIFY_URL }}
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace \
            -PversionCode=$((24000 + GITHUB_RUN_NUMBER)) \
            -PversionName="2.4.$GITHUB_RUN_NUMBER" \
            -PchkPaymentsVerifyEndpoint="$CHK_PAYMENTS_VERIFY_ENDPOINT"
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" | grep -q "jar verified"
          CERT_FP="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          EXPECTED='95:4C:04:AC:6F:3A:66:66:E0:69:1B:17:95:CB:15:6C:D9:7C:9D:F9:2F:B0:0A:AD:29:AC:0B:AE:1F:02:2C:EB'
          if [ "$CERT_FP" != "$EXPECTED" ]; then
            echo "::error::Certificat du bundle different de celui de la cle d'upload."
            exit 1
          fi
          echo "AAB release SIGNE. Destine aux tests techniques/internes uniquement, jamais a la production automatique." >> "$GITHUB_STEP_SUMMARY"
          echo "Ne pas publier ni activer de ventes avant achat, remboursement et verificateur CHK testes." >> "$GITHUB_STEP_SUMMARY"
      - name: AAB signe — artefact reserve au depot
        uses: actions/upload-artifact@v4
        with:
          name: blocnote-signed-aab-INTERNAL
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
