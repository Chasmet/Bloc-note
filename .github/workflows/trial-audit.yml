name: Audit essai 24h — emulation Android 10 et 16
on:
  push:
    branches: [feature/play-24h-lifetime-119-20261111, feature/play-sync30-mesnotesdossiers-20261112]
    paths:
      - "app/**"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/trial-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: SDK de compilation 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Generer signature jetable de test (package .trialtest)
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.13
      - name: Acces KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests instrumentes sur API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Rapports de tests Android
        if: always()
        continue-on-error: true # GitHub artifacts service failure must not mask Android tests result
        uses: actions/upload-artifact@v4
        with:
          name: essai-24h-tests-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
